services:
  redis:
    image: redis:7-alpine
    container_name: keycloak-sso-redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
    container_name: keycloak-sso-backend
    ports:
      - "8000:3001"
    env_file:
      - .env
    environment:
      # Override REDIS_URL so the container uses the Redis service name, not localhost
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
